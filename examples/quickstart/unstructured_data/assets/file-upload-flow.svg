<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
      .text { font-family: Arial, sans-serif; font-size: 14px; fill: #333; text-anchor: middle; }
      .arrow { stroke: #1976d2; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #666; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1976d2" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" class="text" style="font-size: 18px; font-weight: bold;">Unstructured File Upload Flow</text>
  
  <!-- Step 1: Your Connector -->
  <rect x="300" y="60" width="200" height="60" rx="5" class="box"/>
  <text x="400" y="95" class="text" style="font-weight: bold;">Your Connector</text>
  
  <!-- Arrow 1 -->
  <path d="M 400 120 L 400 150" class="arrow"/>
  <text x="450" y="140" class="label">1. Fetch file</text>
  
  <!-- Step 2: Create FileUpload -->
  <rect x="300" y="150" width="200" height="60" rx="5" class="box"/>
  <text x="400" y="175" class="text">Create FileUpload</text>
  <text x="400" y="195" class="label">path, stream</text>
  
  <!-- Arrow 2 -->
  <path d="M 400 210 L 400 240" class="arrow"/>
  <text x="480" y="230" class="label">2. Call op.upsert()</text>
  
  <!-- Step 3: Fivetran Platform -->
  <rect x="300" y="240" width="200" height="60" rx="5" class="box"/>
  <text x="400" y="275" class="text" style="font-weight: bold;">Fivetran Platform</text>
  
  <!-- Arrow 3 -->
  <path d="M 400 300 L 400 330" class="arrow"/>
  <text x="470" y="320" class="label">3. Upload file</text>
  
  <!-- Step 4: Destination Storage -->
  <rect x="300" y="330" width="200" height="60" rx="5" class="box"/>
  <text x="400" y="355" class="text">Destination Storage</text>
  <text x="400" y="375" class="label">Snowflake/BigQuery/Databricks</text>
  
  <!-- Arrow 4 -->
  <path d="M 400 390 L 400 420" class="arrow"/>
  <text x="490" y="410" class="label">4. Write metadata row</text>
  
  <!-- Step 5: Table with _fivetran_file_path -->
  <rect x="250" y="420" width="300" height="60" rx="5" class="box"/>
  <text x="400" y="445" class="text">Table with metadata</text>
  <text x="400" y="465" class="label">+ _fivetran_file_path column</text>
  
  <!-- Arrow 5 -->
  <path d="M 400 480 L 400 510" class="arrow"/>
  <text x="490" y="500" class="label">5. Query & download</text>
  
  <!-- Step 6: Access files -->
  <rect x="300" y="510" width="200" height="60" rx="5" class="box"/>
  <text x="400" y="545" class="text" style="font-weight: bold;">Access Files via Path</text>
</svg>
